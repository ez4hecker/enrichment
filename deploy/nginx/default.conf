# The only public entry point. Basic Auth keeps the test server to the team, because the app
# itself lets anyone sign up (and spend the API credits).
server {
    listen 80 default_server;
    server_name _;

    # CSV uploads: the backend accepts request bodies up to 50 MB.
    client_max_body_size 60m;

    auth_basic "Enrichment internal test";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        proxy_pass http://frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The Basic Auth header is for nginx only.
        proxy_set_header Authorization "";
        # Previews and large uploads can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
